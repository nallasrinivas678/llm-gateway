# fly.toml app configuration file generated for llm-gateway-prnhia on 2026-10-29T19:21:49Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'llm-gateway-prnhia'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  ASPNETCORE_ENVIRONMENT = 'Production'
  Llm__Provider = 'Gemini'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
