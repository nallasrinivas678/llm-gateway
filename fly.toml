app = "tasktide-llm-gateway"       # pick the real app name at `fly launch` time
primary_region = "iad"             # pick the region closest to your Supabase project

[build]
  dockerfile = "Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  Llm__Provider = "Anthropic"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0         # set to 1 later if cold-start latency on first request bothers you

  [[http_service.checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"
