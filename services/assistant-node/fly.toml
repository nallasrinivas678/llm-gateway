# Fly.io config for assistant-node (deployed as the Fly app `assistant-service`).
# Deploy with:  fly deploy --remote-only --config fly.toml   (run from services/assistant-node)
app = 'assistant-service'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # One machine always running: the daily summary cache lives in memory per machine, so a stopped
  # or second machine means cache misses and cold starts. It also keeps Fly from stopping the
  # machine in the middle of a PDF ingest later (Phase 6). Run exactly one machine
  # (`fly scale count 1`) until the cache moves out of memory.
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
