# Fly.io config for assistant-node. Not deployed yet.
# Create the app once with:  fly launch --no-deploy --copy-config --config fly.toml
# (Fly app names are global, so pick a unique name when prompted and update `app` below.)
app = 'assistant-node'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Keep one machine running once PDF ingest runs in the background here (Phase 6),
  # otherwise Fly can stop the machine in the middle of an ingest.
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
