version: 2
updates:
  - package-ecosystem: npm
    directory: /services/assistant-node
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # One pull request for all minor and patch updates instead of one per package.
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
